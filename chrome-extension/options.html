<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RSM HubSpot Tracker Settings</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0a0a0a;color:#e5e5e5;margin:0;padding:24px;max-width:760px}
    h1{font-size:22px;color:#fff}label{display:block;margin-top:16px;font-weight:700;font-size:13px}input{width:100%;box-sizing:border-box;margin-top:6px;background:#151515;border:1px solid #333;color:#e5e5e5;border-radius:8px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    button{margin-top:18px;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#17a192;color:#04110f}.note{color:#999;font-size:13px;line-height:1.5}.status{margin-top:14px;color:#bff7ef}
  </style>
</head>
<body>
  <h1>RSM HubSpot Tracker Settings</h1>
  <p class="note">The admin key is stored in Chrome sync storage and sent only to the tracker refresh endpoint. Cookie values are never shown here.</p>
  <label for="endpoint">Refresh endpoint</label>
  <input id="endpoint" autocomplete="off">
  <label for="adminKey">Tracker admin key</label>
  <input id="adminKey" type="password" autocomplete="off" placeholder="Paste ADMIN_KEY/API_KEY here">
  <button id="save">Save settings</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
